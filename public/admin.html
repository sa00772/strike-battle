<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원 관리 · 플레이 라운지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/member.css">
<style>
 .bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
 .bar input{flex:1;min-width:180px}
 .cnt{color:var(--muted);font-size:.88rem}
 .m{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
 .m.off{opacity:.55}
 .m .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
 .m .h b{font-size:1rem}
 .m small{color:var(--muted)}
 .tag{font-size:.72rem;border:1px solid var(--brass-dim);color:var(--brass);border-radius:99px;padding:1px 8px}
 .tag.bad{border-color:rgba(224,138,122,.5);color:var(--bad)}
 .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
 .tmp{background:var(--ink-2);border:1px solid var(--brass);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:.92rem}
 .tmp code{font-size:1.1rem;color:var(--brass);letter-spacing:.06em}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/">플레이 라운지</a><a class="back" href="/me.html">내 공간</a></header>
<main class="wide" id="app" hidden>
  <h1>회원 관리</h1>
  <p class="sub">마스터 계정 전용 화면이에요. 기기 수 제한 없이 모든 기능을 쓸 수 있어요.</p>
  <section class="box" id="backup">
    <h2>백업</h2>
    <p class="hint" style="margin-bottom:12px">회원 정보와 모든 회원의 선수 명단·경기 기록을 하루에 한 번 자동으로 백업해요. 최근 <span id="keep">10</span>개만 서버에 보관해요. 서버가 잘못되어도 데이터를 지킬 수 있게, <b>가끔 내 컴퓨터로 내려받아 두세요.</b></p>
    <div class="acts" style="margin:0 0 12px"><button class="btn sm" id="b-now">지금 백업하고 내려받기</button></div>
    <ul class="list" id="b-list"></ul>
  </section>
  <div class="bar"><input id="q" placeholder="이름 · 아이디 · 소속 · 전화번호 검색" aria-label="회원 검색"><span class="cnt" id="cnt"></span></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (url, opt = {}) => {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/login.html?next=/admin.html'; throw new Error('401'); }
  if (!r.ok) throw new Error(j.error || '문제가 생겼어요.');
  return j;
};
const ORG = { dojang: '도장', school: '학교', etc: '기타' };
let items = [], max = 5, temp = {};
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const shown = items.filter((m) => !q || [m.name, m.username, m.org, m.phone].some((v) => String(v).toLowerCase().includes(q)));
  $('#cnt').textContent = `전체 ${items.length}명` + (q ? ` · 검색 ${shown.length}명` : '');
  $('#list').innerHTML = shown.length ? shown.map((m) => `
    <div class="m ${m.disabled ? 'off' : ''}">
      <div class="h"><b>${esc(m.name)}</b><small>${esc(m.username)}</small>
        ${m.role === 'master' ? '<span class="tag">마스터</span>' : ''}${m.disabled ? '<span class="tag bad">정지됨</span>' : ''}</div>
      <small>${ORG[m.orgType] || ''} · ${esc(m.org)} · ${esc(m.phone)}</small>
      <small>가입 ${new Date(m.createdAt).toLocaleDateString('ko-KR')} · 로그인 기기 ${m.devices}${m.role === 'master' ? '대 (제한 없음)' : ` / ${max}대`}</small>
      ${temp[m.id] ? `<div class="tmp">임시 비밀번호: <code>${esc(temp[m.id])}</code><br><small>한 번만 보여요. 회원에게 알려 주고, 로그인 후 바꾸도록 안내해 주세요.</small></div>` : ''}
      ${m.role === 'master' ? '' : `<div class="acts">
        <button class="btn ghost sm" data-a="reset" data-id="${m.id}">임시 비밀번호 발급</button>
        <button class="btn ghost sm" data-a="disable" data-id="${m.id}" data-v="${m.disabled ? 0 : 1}">${m.disabled ? '정지 해제' : '이용 정지'}</button>
        <button class="btn danger sm" data-a="del" data-id="${m.id}">삭제</button></div>`}
    </div>`).join('') : '<p class="empty">조건에 맞는 회원이 없어요.</p>';
}
async function load() { const j = await api('/api/admin/members'); items = j.items; max = j.maxDevices; render(); }
$('#q').oninput = render;
$('#list').onclick = async (e) => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, m = items.find((x) => String(x.id) === id);
  try {
    if (b.dataset.a === 'reset') {
      if (!confirm(`${m.name} 님의 임시 비밀번호를 발급할까요?\n현재 로그인된 기기는 모두 로그아웃돼요.`)) return;
      temp[id] = (await api(`/api/admin/members/${id}/reset`, { method: 'POST' })).password;
    } else if (b.dataset.a === 'disable') {
      await api(`/api/admin/members/${id}/disable`, { method: 'POST', body: JSON.stringify({ disabled: b.dataset.v === '1' }) });
    } else if (b.dataset.a === 'del') {
      if (!confirm(`${m.name} 님을 삭제할까요?\n명단과 경기 기록까지 모두 지워지고 되돌릴 수 없어요.`)) return;
      await api(`/api/admin/members/${id}`, { method: 'DELETE' });
    }
    await load();
  } catch (er) { alert(er.message); }
};
const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
async function loadBackups() {
  const j = await api('/api/admin/backups'); $('#keep').textContent = j.keep;
  $('#b-list').innerHTML = j.items.length ? j.items.map((b) =>
    `<li><span class="grow">${new Date(b.createdAt).toLocaleString('ko-KR')}<small>${esc(b.name)} · ${fmtSize(b.size)}</small></span>
      <a class="btn ghost sm" href="/api/admin/backups/${encodeURIComponent(b.name)}" download>내려받기</a>
      <button class="btn ghost sm" data-bdel="${esc(b.name)}">삭제</button></li>`).join('')
    : '<p class="empty">아직 백업이 없어요. 서버가 켜진 뒤 1분쯤 지나면 첫 자동 백업이 만들어져요.</p>';
}
$('#b-now').onclick = async () => {
  const btn = $('#b-now'); btn.disabled = true; btn.textContent = '백업 만드는 중…';
  try { const j = await api('/api/admin/backups', { method: 'POST' }); await loadBackups(); location.href = '/api/admin/backups/' + encodeURIComponent(j.name); }
  catch (er) { alert(er.message); } finally { btn.disabled = false; btn.textContent = '지금 백업하고 내려받기'; }
};
$('#b-list').onclick = async (e) => {
  const n = e.target.dataset.bdel; if (!n || !confirm('이 백업을 삭제할까요?')) return;
  try { await api('/api/admin/backups/' + encodeURIComponent(n), { method: 'DELETE' }); loadBackups(); } catch (er) { alert(er.message); }
};
(async () => {
  const { member: m } = await api('/api/me');
  if (!m) { location.href = '/login.html?next=/admin.html'; return; }
  if (m.role !== 'master') { location.href = '/me.html'; return; }
  $('#app').hidden = false; load(); loadBackups();
})();
</script>
</body>
</html>
