<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>미션 덱 - 플레이 라운지</title>
<style>
  :root{--bg:#fff3dc;--card:#fffaf0;--ink:#2b2a33;--muted:#8a7757;--line:#f0d9ad;--accent:#e8590c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(80vmax 60vmax at 50% -10%,#fff9e6,var(--bg) 60%,#ffe6bd);background-attachment:fixed;color:var(--ink);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{font-size:1.4rem;font-weight:900}
  .room{color:var(--muted);font-size:.9rem;font-weight:700;background:#fff;border:1px solid var(--line);padding:.25em .8em;border-radius:999px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
  .timer{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .t-val{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .t-mode{color:var(--muted);font-size:.9rem;font-weight:700}
  .btns{display:flex;gap:8px}
  .btns button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:.8em 1.1em;background:#f3e6c8;color:#5b4a2e;cursor:pointer}
  .btns button.p{background:#2f9e5f;color:#fff}
  .btns button:focus-visible,.gate button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .gate{display:none;flex-direction:column;gap:12px;margin-top:6vh}
  .gate p{font-weight:800;font-size:1.1rem}
  .gate input{font:inherit;font-size:1.3rem;padding:.8em 1em;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:center;letter-spacing:.08em}
  .gate input:focus{outline:none;border-color:#ff922b;box-shadow:0 0 0 3px rgba(255,146,43,.25)}
  .gate button{font:inherit;font-size:1.1rem;font-weight:900;padding:.9em;border:0;border-radius:16px;background:var(--accent);color:#fff;box-shadow:0 4px 0 #b8430a;cursor:pointer}
  body.need-room #pick{display:flex} body.need-login:not(.need-room) #login{display:flex}
  body.need-room .main,body.need-login .main{display:none}
  .err{color:#d9480f;min-height:1.3em;font-weight:700}
  .main{display:flex;flex-direction:column;gap:16px}
  .hint{color:var(--muted);font-size:.9rem;line-height:1.6}
</style>
</head>
<body class="need-login">
<div class="wrap">
  <header><h1>🚨 미션 덱</h1><span class="room" id="room"></span></header>

  <form class="gate" id="pick">
    <p>경기방 코드를 입력하세요</p>
    <input id="room-in" type="text" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="예) K7M2QX" aria-label="경기방 코드">
    <button type="submit">연결하기</button>
    <div class="hint">점수판 가운데 아래의 <b>경기방</b> 코드를 입력하거나, 점수판의 <b>미션 덱 › 사범님 휴대폰을 리모컨으로</b> QR을 스캔하세요.</div>
  </form>

  <form class="gate" id="login">
    <p>회원 로그인이 필요해요</p>
    <button type="submit">로그인 / 회원가입</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <div class="main">
    <div class="card timer">
      <div><div class="t-val" id="t-val">0:00</div><div class="t-mode" id="t-mode"></div></div>
      <div class="btns"><button class="p" id="b-start">시작</button><button id="b-pause">정지</button></div>
    </div>
    <div class="card"><div id="deck"></div></div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/mission.js"></script>
<script src="/deck.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  $('room').textContent = room ? `경기방 ${room}` : '경기방 없음';
  if (!room) document.body.classList.add('need-room');
  $('pick').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('room-in').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length >= 4) location.search = `?room=${v}`;
  });
  const socket = io();
  let pw = '';
  try { pw = sessionStorage.getItem('strike-admin') || ''; } catch (_) {}
  const join = () => socket.emit('join', { role: 'scoreboard', password: pw, room });
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const ERR = { 'rate-limited': '시도가 너무 많습니다. 1분 뒤에 다시 시도하세요.', 'bad-room': '경기방 주소가 올바르지 않습니다. 점수판의 QR을 다시 스캔하세요.' };
  socket.on('connect', () => { if (room) join(); });
  socket.on('join:result', (r) => {
    if (r.ok) { document.body.classList.remove('need-login'); try { sessionStorage.setItem('strike-admin', pw); } catch (_) {} }
    else { document.body.classList.add('need-login'); $('err').textContent = ERR[r.reason] || ''; }
  });
  $('login').addEventListener('submit', (e) => { e.preventDefault(); location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search); });
  Deck.mount($('deck'), socket);
  socket.on('game:state', (s) => {
    $('t-val').textContent = fmt(s.remainingSec);
    $('t-mode').textContent = (s.mode === 'round' ? '라운드' : '휴식') + (s.running ? ' 진행 중' : s.finished ? ' 종료' : ' 정지');
  });
  $('b-start').addEventListener('click', () => socket.emit('timer:start'));
  $('b-pause').addEventListener('click', () => socket.emit('timer:pause'));
})();
</script>
</body>
</html>
