<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사범님 리모컨 - 플레이 라운지</title>
<style>
  :root{--base:#12141b;--panel:#1b1e28;--ink:#f5f7fb;--muted:#9aa3b5;--line:#2a2f3d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--base);color:var(--ink);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  h1{font-size:1.3rem;font-weight:900}
  .room{color:var(--muted);font-size:.9rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .timer{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .t-val{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums}
  .t-mode{color:var(--muted);font-size:.9rem}
  .btns{display:flex;gap:8px}
  .btns button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:.7em 1em;background:#323847;color:var(--ink);cursor:pointer}
  .btns button.p{background:#1f9d57}
  .btns button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .login{display:none;flex-direction:column;gap:12px;margin-top:10vh}
  body.need-login .login{display:flex} body.need-login .main{display:none}
  .login input{font:inherit;font-size:1.2rem;padding:.8em 1em;border-radius:10px;border:2px solid #3a4152;background:var(--panel);color:var(--ink)}
  .login button{font:inherit;font-size:1.1rem;font-weight:900;padding:.9em;border:0;border-radius:12px;background:#fff;color:#11141b}
  .err{color:#ff8a80;min-height:1.3em}
  .main{display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body class="need-login">
<div class="wrap">
  <header><h1>사범님 리모컨</h1><span class="room" id="room"></span></header>

  <form class="login" id="login">
    <p>관리자 비밀번호를 입력하세요</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호">
    <button type="submit">연결</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <div class="main">
    <div class="card timer">
      <div><div class="t-val" id="t-val">0:00</div><div class="t-mode" id="t-mode"></div></div>
      <div class="btns"><button class="p" id="b-start">시작</button><button id="b-pause">정지</button></div>
    </div>
    <div class="card"><div id="deck"></div></div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/mission.js"></script>
<script src="/deck.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  $('room').textContent = room ? `경기방 ${room}` : '경기방 없음';
  const socket = io();
  let pw = '';
  try { pw = sessionStorage.getItem('strike-admin') || ''; } catch (_) {}
  const join = () => socket.emit('join', { role: 'scoreboard', password: pw, room });
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const ERR = { 'bad-password': '비밀번호가 맞지 않습니다.', 'rate-limited': '시도가 너무 많습니다. 1분 뒤에 다시 시도하세요.', 'bad-room': '경기방 주소가 올바르지 않습니다. 점수판의 QR을 다시 스캔하세요.' };
  socket.on('connect', () => { if (room) join(); });
  socket.on('join:result', (r) => {
    if (r.ok) { document.body.classList.remove('need-login'); try { sessionStorage.setItem('strike-admin', pw); } catch (_) {} }
    else { document.body.classList.add('need-login'); if (r.reason === 'bad-password') { pw = ''; } $('err').textContent = ERR[r.reason] || ''; }
  });
  $('login').addEventListener('submit', (e) => { e.preventDefault(); pw = $('pw').value; join(); });
  Deck.mount($('deck'), socket);
  socket.on('game:state', (s) => {
    $('t-val').textContent = fmt(s.remainingSec);
    $('t-mode').textContent = (s.mode === 'round' ? '라운드' : '휴식') + (s.running ? ' 진행 중' : s.finished ? ' 종료' : ' 정지');
  });
  $('b-start').addEventListener('click', () => socket.emit('timer:start'));
  $('b-pause').addEventListener('click', () => socket.emit('timer:pause'));
})();
</script>
</body>
</html>
