<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<title>셔틀런 · 플레이 라운지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
  :root{color-scheme:dark;--ink:#0d0c0b;--ink-2:#171513;--paper:#f1ebdd;--muted:#a8a090;--brass:#c9a862;--line:rgba(241,235,221,.14);--go:#4fb286;
    --serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;transition:background .12s}
  body.beep{background:#14261e}
  a{color:inherit;text-decoration:none} button,select{font:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .top{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
  .top .logo{font-family:var(--serif);font-weight:900;letter-spacing:.04em} .top .back{color:var(--muted);font-size:.86rem}
  main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 20px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
  h1{font-family:var(--serif);font-weight:900;font-size:1.4rem} .lead{color:var(--muted);font-size:.9rem;line-height:1.65;word-break:keep-all}
  .stage{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border:1px solid var(--line);border-radius:18px;background:var(--ink-2);padding:20px 12px}
  .lvl{font-family:var(--serif);font-weight:900;font-size:1.5rem;color:var(--brass)}
  .count{font-weight:900;font-size:clamp(7rem,38vw,13rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .unit{color:var(--muted);font-size:1rem}
  .sub{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
  .bar{width:min(86%,380px);height:10px;border-radius:99px;background:rgba(241,235,221,.1);overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:var(--go)}
  .next{font-size:.85rem;color:var(--muted);height:1.3em}
  .row{display:flex;gap:10px}
  .btn{flex:1;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);font-weight:800;font-size:1.05rem}
  .btn.main{background:var(--brass);color:#1a1308;border-color:var(--brass)}
  .opts{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.92rem}
  .opt small{color:var(--muted)}
  .opt select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);padding:0 8px;max-width:58%}
  .opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--brass)}
  .opt input[type=range]{accent-color:var(--brass);width:44%}
  .best{color:var(--muted);font-size:.88rem;text-align:center;min-height:1.3em}
  .result{border:1px solid var(--brass);border-radius:14px;padding:14px;text-align:center;line-height:1.7}
  .result b{font-family:var(--serif);font-size:1.6rem;color:var(--brass)}
  .note{color:var(--muted);font-size:.82rem;line-height:1.6;word-break:keep-all}
  @media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/">플레이 라운지</a><a class="back" href="/#tools">← 도구실</a></div>
<main>
  <div><h1>셔틀런 (왕복오래달리기)</h1>
  <p class="lead">신호음에 맞춰 목소리가 횟수를 읽어 주고, 화면 숫자도 같이 올라갑니다. 단계가 올라갈수록 간격이 짧아집니다.</p></div>

  <section class="stage">
    <div class="lvl" id="lvl">준비</div>
    <div class="count" id="count">0</div>
    <div class="unit">회</div>
    <div class="sub" id="sub">시작을 누르면 5초 뒤 출발합니다</div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="next" id="next"></div>
    <div class="note" id="vstat" style="min-height:1.2em"></div>
  </section>

  <div class="row">
    <button class="btn main" id="play">시작</button>
    <button class="btn" id="reset" style="flex:none;padding:0 20px">처음으로</button>
  </div>
  <button class="btn" id="test" style="flex:none;min-height:44px;font-size:.95rem">소리 확인 (신호음 + 목소리)</button>
  <p class="note" id="snote">아이폰은 무음 스위치(벨 모양)가 켜져 있어도 소리가 나도록 처리했지만, 음량이 0이면 들리지 않습니다. 소리 확인으로 먼저 점검해 보세요.</p>
  <div class="result" id="result" hidden></div>
  <div class="best" id="best"></div>

  <div class="opts">
    <label class="opt"><span>목소리 안내<br><small>신호음 뒤에 횟수를 읽어 줍니다</small></span><input type="checkbox" id="voice" checked></label>
    <label class="opt"><span>음성 선택</span><select id="vsel" aria-label="음성"></select></label>
    <label class="opt"><span>음량</span><input type="range" id="vol" min="0.2" max="1" step="0.1" value="1"></label>
    <label class="opt"><span>코스 길이</span><select id="dist"><option value="20">20m (기본)</option><option value="15">15m (간격 짧게)</option></select></label>
    <label class="opt"><span>시작 단계</span><select id="start"></select></label>
    <label class="opt"><span>신호음마다 화면 깜빡임</span><input type="checkbox" id="flash" checked></label>
    <label class="opt"><span>신호음마다 진동 <small>(지원 기기)</small></span><input type="checkbox" id="vib"></label>
    <p class="note" id="vnote"></p>
  </div>
</main>

<script>
(() => {
  const $ = (i) => document.getElementById(i);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
  try { fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: 'tool:shuttle' }), keepalive: true }).catch(() => {}); } catch (_) {}

  // 속도표: 1단계 8.0km/h에서 단계마다 0.5km/h씩 올라갑니다. 20m 코스 한 번 왕복(편도) 시간 = 72 / 속도(km/h)
  const LAPS_PER = [7, 8, 8, 9, 9, 10, 10, 11, 11];             // 10단계부터는 12회
  const MAXLV = 21;
  const lapsOf = (L) => LAPS_PER[L - 1] || 12;
  const speed = (L) => 8 + 0.5 * (L - 1);
  const COUNTDOWN = 5;                                          // 출발 신호까지 초

  for (let L = 1; L <= MAXLV; L++) { const o = document.createElement('option'); o.value = L; o.textContent = L + '단계 (' + speed(L).toFixed(1) + 'km/h)'; $('start').appendChild(o); }
  const saved = (k, d) => store.get(k) || d;
  $('dist').value = saved('shuttle_dist', '20'); $('start').value = saved('shuttle_start', '1');
  $('voice').checked = saved('shuttle_voice', '1') === '1'; $('vol').value = saved('shuttle_vol', '1');
  $('flash').checked = saved('shuttle_flash', '1') === '1'; $('vib').checked = saved('shuttle_vib', '0') === '1';
  ['dist', 'start', 'vol'].forEach((id) => $(id).addEventListener('change', () => store.set('shuttle_' + id, $(id).value)));
  ['voice', 'flash', 'vib'].forEach((id) => $(id).addEventListener('change', () => store.set('shuttle_' + id, $(id).checked ? '1' : '0')));

  // ---- 목소리 ----
  const synth = window.speechSynthesis;
  let voices = [];
  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices().filter((v) => /^ko/i.test(v.lang));
    const cur = store.get('shuttle_voiceName') || '';
    $('vsel').innerHTML = voices.length ? voices.map((v) => '<option value="' + v.name.replace(/"/g, '&quot;') + '">' + v.name.replace(/</g, '&lt;') + '</option>').join('') : '<option value="">기본 음성</option>';
    if (cur && voices.some((v) => v.name === cur)) $('vsel').value = cur;
    $('vnote').textContent = !synth ? '이 브라우저는 음성 안내를 지원하지 않아 신호음만 울립니다.' : voices.length ? '' : '한국어 음성을 찾지 못해 기본 음성으로 읽습니다. 기기의 음성 설정에서 한국어 음성을 받으면 더 자연스럽습니다.';
  }
  if (synth) { loadVoices(); synth.addEventListener && synth.addEventListener('voiceschanged', loadVoices); }
  else $('vnote').textContent = '이 브라우저는 음성 안내를 지원하지 않아 신호음만 울립니다.';
  $('vsel').addEventListener('change', () => store.set('shuttle_voiceName', $('vsel').value));
  // 끊김 방지: ① 객체를 붙들어 둔다(브라우저가 읽는 도중 지우는 버그) ② 앞 소리가 아직 끝나지 않았을 때만 자른다 ③ 신호음이 끝난 뒤에 읽는다
  const live = new Set();
  const vstat = (t) => { const el = $('vstat'); if (el) el.textContent = t; };
  function say(text, delay) {
    if (!synth || !$('voice').checked) return;
    setTimeout(() => {
      try {
        if (synth.speaking || synth.pending) synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR'; u.rate = 1.0; u.volume = parseFloat($('vol').value) || 1;
        const v = voices.find((x) => x.name === $('vsel').value); if (v) u.voice = v;
        live.add(u);
        u.onend = () => { live.delete(u); vstat(''); };
        u.onerror = (e) => { live.delete(u); if (e && e.error && e.error !== 'canceled' && e.error !== 'interrupted') vstat('목소리 오류: ' + e.error); };
        synth.speak(u);
      } catch (e) { vstat('목소리 오류'); }
    }, delay == null ? 0 : delay);
  }

  // ---- 아이폰 무음 스위치 우회: 소리 없는 <audio>를 반복 재생하면 웹 오디오도 '미디어 재생'으로 취급되어 들립니다 ----
  let keep = null;
  function silentWavUrl() {
    const sr = 8000, n = sr, b = new Uint8Array(44 + n), dv = new DataView(b.buffer);
    const w = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
    w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true);
    b.fill(128, 44);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  }
  function keepAlive(on) {
    try {
      if (on) { if (!keep) { keep = new Audio(silentWavUrl()); keep.loop = true; keep.setAttribute('playsinline', ''); } const pr = keep.play(); if (pr && pr.catch) pr.catch(() => {}); }
      else if (keep) keep.pause();
    } catch (_) {}
  }
  async function openCtx() {                                    // 반드시 버튼을 누른 그 순간에 호출
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    keepAlive(true);
    const c = new AC();
    try { if (synth) { synth.cancel(); const w = new SpeechSynthesisUtterance(' '); w.volume = 0; synth.speak(w); } } catch (_) {}
    try { await Promise.race([c.resume(), new Promise((r) => setTimeout(r, 600))]); } catch (_) {}
    return c;
  }

  // ---- 신호음 (브라우저 오디오 시계로 미리 예약해서 정확하게) ----
  let ctx = null, timer = 0, raf = 0, running = false;
  let laps = [];                // laps[k] = 출발(0) 기준 k번째 신호 시각(초)
  let levelOf = [];             // levelOf[i] = i+1번째 왕복이 속한 단계
  let baseCount = 0;            // 시작 단계 이전의 표준 누적 횟수
  let P0 = 0;                   // 출발 신호의 기기 시각(performance.now, ms) — 화면과 진행의 기준 시계
  let scheduled = 0, spoken = 0, lastShown = -1, ended = false;

  function buildSchedule() {
    const S = parseInt($('start').value, 10), scale = $('dist').value === '15' ? 0.75 : 1;
    laps = [0]; levelOf = []; baseCount = 0;
    for (let L = 1; L < S; L++) baseCount += lapsOf(L);
    for (let L = S; L <= MAXLV; L++) for (let i = 0; i < lapsOf(L); i++) { laps.push(laps[laps.length - 1] + 72 / speed(L) * scale); levelOf.push(L); }
  }
  function beep(at, long) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 560;
    const vol = (parseFloat($('vol').value) || 1) * 0.5, d = long ? 0.4 : 0.2;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.setValueAtTime(vol, at + d - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.connect(g); g.connect(ctx.destination); o.start(at); o.stop(at + d + 0.02);
  }
  function pump() {                                             // 앞으로 약 2초 분량의 신호음을 예약
    if (!ctx || !running) return;
    if (ctx.state !== 'running') { try { ctx.resume(); } catch (_) {} }          // 아이폰이 오디오를 멈췄으면 다시 깨운다
    const now = nowT(), base = ctx.currentTime;                                  // 기기 시계 → 오디오 시계로 환산해서 예약
    while (scheduled < laps.length && laps[scheduled] - now < 2) { beep(base + Math.max(0, laps[scheduled] - now), scheduled === 0); scheduled++; }
    for (let s = 1; s <= 3; s++) { const d = -s - now; if (!pump.cd[s] && d < 2 && d > -0.05) { pump.cd[s] = 1; beep(base + Math.max(0, d), false); } }
  }
  pump.cd = {};

  function nowT() { return (performance.now() - P0) / 1000; }             // 출발 신호 기준 경과 시간 (출발 전에는 음수)
  function tick() {
    if (!ctx || !running) return;
    pump();
    const t = nowT();
    let n = 0; while (n < levelOf.length && laps[n + 1] <= t) n++;       // 완료한 왕복 수
    if (t < 0) {                                                          // 출발 전 카운트다운
      const left = Math.ceil(-t);
      if (left !== lastShown) { lastShown = left; if (left <= 3) say(String(left), 250); else if (left === COUNTDOWN) say('준비', 0); }
      $('lvl').textContent = '준비'; $('count').textContent = baseCount; $('sub').textContent = '출발까지 ' + left + '초'; $('bar').style.width = '0'; $('next').textContent = '';
      return;
    }
    if (lastShown !== -2) { lastShown = -2; say('출발', 350); }
    if (n !== spoken) {                                                   // 신호음이 울린 순간 횟수를 읽는다
      spoken = n;
      if (n > 0) {
        const total = baseCount + n, newLv = n < levelOf.length && levelOf[n] !== levelOf[n - 1];
        say(newLv ? total + ', ' + levelOf[n] + '단계' : String(total), 300);
        if ($('flash').checked) { document.body.classList.add('beep'); setTimeout(() => document.body.classList.remove('beep'), 160); }
        if ($('vib').checked && navigator.vibrate) navigator.vibrate(40);
      }
    }
    if (n >= levelOf.length) { finish(); return; }
    const L = levelOf[n], firstOfLv = levelOf.indexOf(L), inLv = n - firstOfLv, inTotal = lapsOf(L);
    const a = laps[n], b = laps[n + 1];
    $('count').textContent = baseCount + n;
    $('lvl').textContent = L + '단계';
    $('sub').textContent = '이 단계 ' + inLv + '/' + inTotal + '회 · ' + speed(L).toFixed(1) + 'km/h';
    $('bar').style.width = Math.max(0, Math.min(100, (t - a) / (b - a) * 100)) + '%';
    const left = b - t; $('next').textContent = left < 3 ? '다음 신호까지 ' + left.toFixed(1) + '초' : '';
  }
  const frame = () => { tick(); if (running) raf = requestAnimationFrame(frame); };

  const showBest = () => { const b = parseInt(store.get('shuttle_best') || '0', 10); $('best').textContent = b ? '내 최고 기록 ' + b + '회 (이 기기)' : ''; };
  showBest();
  function resultNow() {
    const t = Math.max(0, nowT());
    let n = 0; while (n < levelOf.length && laps[n + 1] <= t) n++;
    const total = baseCount + n, L = n > 0 ? levelOf[n - 1] : (parseInt($('start').value, 10));
    const best = parseInt(store.get('shuttle_best') || '0', 10);
    let msg = '<b>' + total + '회</b><br>' + (n > 0 ? L + '단계까지 달렸어요' : '출발 전에 멈췄어요');
    if (n > 0 && total > best && baseCount === 0) { store.set('shuttle_best', String(total)); msg += '<br>새 최고 기록!'; }
    $('result').innerHTML = msg; $('result').hidden = false; showBest();
  }
  function stop(showResult) {
    running = false; cancelAnimationFrame(raf); clearInterval(timer);
    try { synth && synth.cancel(); } catch (_) {}
    if (showResult && ctx && nowT() >= 0) resultNow();
    if (ctx) { try { ctx.close(); } catch (_) {} ctx = null; }
    keepAlive(false);
    ['start', 'dist'].forEach((id) => { $(id).disabled = false; });
    $('play').textContent = '시작';
  }
  function finish() { stop(true); $('sub').textContent = '마지막 단계까지 모두 끝났어요'; }

  $('play').addEventListener('click', async () => {
    if (running) { stop(true); return; }
    if (testCtx) { try { testCtx.close(); } catch (_) {} testCtx = null; }
    $('play').disabled = true;
    ctx = await openCtx();
    $('play').disabled = false;
    if (!ctx) { $('sub').textContent = '이 브라우저는 소리를 낼 수 없습니다.'; return; }
    buildSchedule();
    $('result').hidden = true;
    P0 = performance.now() + COUNTDOWN * 1000; scheduled = 0; spoken = 0; lastShown = -1; pump.cd = {}; running = true;
    ['start', 'dist'].forEach((id) => { $(id).disabled = true; });
    $('play').textContent = '멈춤';
    timer = setInterval(tick, 50); frame();
  });
  let testCtx = null;
  $('test').addEventListener('click', async () => {
    if (running) return;
    if (testCtx) { try { testCtx.close(); } catch (_) {} }
    const c = await openCtx(); if (!c) { $('snote').textContent = '이 브라우저는 소리를 낼 수 없습니다.'; return; }
    testCtx = c; const keepCtx = ctx; ctx = c;
    beep(c.currentTime + 0.05, false); beep(c.currentTime + 0.5, false);
    ctx = keepCtx;
    say('소리 확인, 하나 둘 셋', 900);
    $('snote').textContent = c.state === 'running' ? '신호음 두 번과 목소리가 들려야 합니다. 신호음만 들리면 목소리 안내 설정이나 기기의 한국어 음성을 확인해 주세요. 아무 소리도 안 들리면 기기 음량과 무음 모드를 확인해 주세요.' : '오디오가 시작되지 않았습니다(' + c.state + '). 화면을 한 번 더 눌러 주세요.';
    setTimeout(() => keepAlive(false), 4000);
  });
  $('reset').addEventListener('click', () => { stop(false); $('result').hidden = true; $('lvl').textContent = '준비'; $('count').textContent = '0'; $('sub').textContent = '시작을 누르면 5초 뒤 출발합니다'; $('bar').style.width = '0'; $('next').textContent = ''; });
  window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $('play').click(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && running) tick(); });
})();
</script>
</body>
</html>
