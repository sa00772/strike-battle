<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심판 채점 - 플레이 라운지</title>
<style>
  :root { --bg:#12141b; --panel:#1b1e28; --panel2:#232736; --ink:#f5f7fb; --muted:#9aa3b5; --line:#2e3342; --blue:#2f6bff; --red:#ff4536; --gold:#ffd23f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); }
  button { font:inherit; font-weight:800; border:0; border-radius:12px; padding:.8em 1em; background:#323847; color:var(--ink); }
  button.primary { background:#1f9d57; } button:disabled { opacity:.4; }
  button:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  input { font:inherit; background:#12141b; color:var(--ink); border:2px solid #3a4152; border-radius:12px; padding:.7em .8em; width:100%; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .top b { font-size:1.05rem; } .top span { color:var(--muted); font-size:.9rem; }
  .page { max-width:560px; margin:0 auto; padding:16px 14px 40px; display:flex; flex-direction:column; gap:14px; }
  .center { text-align:center; padding:50px 10px; line-height:1.7; } .center .big { font-size:1.6rem; font-weight:900; margin-bottom:8px; }
  .muted { color:var(--muted); }
  .seatgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .seatgrid button { padding:1.1em .5em; font-size:1.1rem; } .seatgrid button:disabled { background:#2a2f3b; }
  .side { border-radius:16px; border:2px solid var(--line); background:var(--panel); overflow:hidden; }
  .side.a { border-color:var(--blue); } .side.b { border-color:var(--red); }
  .side > header { padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .side.a > header { background:rgba(47,107,255,.3); } .side.b > header { background:rgba(255,69,54,.3); } .side.solo > header { background:var(--panel2); }
  .who b { font-size:1.25rem; display:block; } .who span { color:var(--muted); font-size:.85rem; }
  .tot { text-align:right; } .tot b { font-size:2rem; font-variant-numeric:tabular-nums; display:block; line-height:1; } .tot span { font-size:.75rem; color:var(--muted); }
  .grp { padding:10px 14px 4px; color:var(--muted); font-size:.85rem; font-weight:800; display:flex; justify-content:space-between; }
  .fld { padding:8px 14px 12px; border-top:1px solid var(--line); }
  .fld .l { display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px; } .fld .l output { font-variant-numeric:tabular-nums; color:var(--gold); }
  .stepper { display:grid; grid-template-columns:64px 1fr 64px; gap:8px; align-items:center; } .stepper button { font-size:1.5rem; padding:.4em; } .stepper .n { text-align:center; font-size:1.8rem; font-weight:900; font-variant-numeric:tabular-nums; }
  input[type=range] { padding:0; height:44px; accent-color:var(--gold); border:0; background:none; }
  .scale { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); }
  .submit { position:sticky; bottom:0; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 30%); }
  .submit button { width:100%; font-size:1.2rem; padding:1em; }
  .err { color:#ff8a80; min-height:1.3em; font-weight:700; }
  .pill { display:inline-block; background:var(--gold); color:#11141b; padding:.2em .8em; border-radius:999px; font-weight:900; }
  .conn { position:fixed; top:0; left:0; right:0; background:#b3261e; text-align:center; padding:6px; font-weight:800; z-index:50; display:none; }

  /* ---- 채점 시트 (품새 채점 화면) ---- */
  .page { max-width: 980px; }
  .hdr { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .hk { color: var(--muted); font-size: .8rem; font-weight: 700; margin-bottom: 6px; }
  .hrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .hdr.dual .hrow { grid-template-columns: 1fr auto 1fr; }
  .hs { display: flex; align-items: center; gap: 10px; min-width: 0; } .hs.r { justify-content: flex-end; }
  .hw { min-width: 0; } .hw b { display: block; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hw span { color: var(--muted); font-size: .8rem; }
  .hw.a b { color: #7fb6ff; } .hw.b b { color: #ff9a8f; }
  .hb { display: flex; gap: 6px; } .hb span { min-width: 3.1em; text-align: center; font-weight: 900; font-variant-numeric: tabular-nums; border-radius: 8px; padding: .25em .4em; }
  .hb .b1 { background: #b3367a; } .hb .b2 { background: #8b3fd1; } .hb .b3 { background: #4d6b13; color: #fff; }
  .hm { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .send { background: #1d6fb8; font-size: 1rem; padding: .6em 1.2em; border-radius: 10px; }
  .sheet { display: grid; gap: 10px; grid-template-columns: 1fr 2.3fr 1fr; align-items: stretch; margin-top: 12px; }
  .ded { display: flex; flex-direction: column; gap: 10px; } .ded-box { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .dbtn { flex: 1; min-height: 110px; font-size: clamp(2rem, 7vw, 3.4rem); border-radius: 18px; font-variant-numeric: tabular-nums; }
  .ded-box.minor .dbtn { background: linear-gradient(160deg, #7c4dff, #4a2fb8); } .ded-box.major .dbtn { background: linear-gradient(160deg, #e0508f, #a02a62); }
  .cnt { text-align: center; color: var(--muted); font-weight: 800; } .cnt b { color: var(--ink); font-size: 1.2rem; }
  .undo { padding: .15em .6em; font-size: .95rem; background: #2a2f3b; border-radius: 8px; margin-left: .4em; }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .grp3 { text-align: center; font-weight: 800; color: var(--muted); background: var(--panel2); border-radius: 8px; padding: .3em; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 8px; min-height: 64px; }
  .sheet.solo .row3 { grid-template-columns: 1fr 1.4fr; } .sheet.solo .row3 .lb { order: -1; text-align: left; }
  .lb { text-align: center; font-weight: 800; line-height: 1.25; }
  .box { min-width: 4.2em; padding: .7em .4em; border-radius: 10px; font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; }
  .box.v { background: #17506a; } .box.v.b { background: #8b2929; } .box.v.a, .box.v.solo { background: #17506a; }
  .box.acc { background: #b3367a; color: #fff; }
  .sheet.dual .row3 .v.a { justify-self: start; } .sheet.dual .row3 .v.b { justify-self: end; }
  .picker { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 60; padding: 16px; } .picker[hidden] { display: none; }
  .pk { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; width: min(420px, 100%); }
  .pkt { text-align: center; font-weight: 900; margin-bottom: 10px; font-size: 1.1rem; }
  .pkg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; } .pkg button { font-size: 1.25rem; padding: .8em 0; font-variant-numeric: tabular-nums; } .pkg button.on { background: var(--gold); color: #11141b; }
  .pkx { width: 100%; margin-top: 10px; background: #2a2f3b; }
  @media (max-width: 700px) {
    .sheet { grid-template-columns: 1fr 1fr; } .sheet .rows { grid-column: 1 / -1; grid-row: 2; }
    .ded, .ded-box, .sheet > * { min-width: 0; } .ded.stack { flex-direction: row; gap: 6px; } .dbtn { min-height: 64px; font-size: 1.5rem; padding: 0; } .cnt { font-size: .85rem; } .undo { margin-left: .2em; }
    .row3 { grid-template-columns: 1fr 1.2fr 1fr; gap: 4px; } .box { min-width: 0; width: 100%; font-size: 1.25rem; } .lb { font-size: .9rem; }
    .hs { flex-wrap: wrap; gap: 4px; } .hb span { min-width: 2.4em; font-size: .85rem; padding: .2em .3em; } .hs.r { justify-content: flex-start; flex-direction: row-reverse; }
    .hdr.dual .hrow { grid-template-columns: 1fr 1fr; } .hdr.dual .hm { grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: space-between; }
  }
  .hdr { position: sticky; top: 49px; z-index: 9; }
  .sheet.solo .ded { align-self: start; position: sticky; top: 150px; } .sheet.solo .dbtn { flex: none; min-height: 150px; }
</style>
</head>
<body>
<div class="conn" id="conn" role="alert">연결이 끊겼습니다. 다시 연결하는 중…</div>
<div class="top"><b id="ttl">심판 채점</b><span id="seatLabel"></span></div>
<main class="page" id="app"></main>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = (x) => Math.round(x * 100) / 100;
  const f2 = (x) => Number(x).toFixed(2);
  const eventId = (new URLSearchParams(location.search).get('event') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const app = $('#app');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} },
  };
  let token = store.get('tkd-token');
  if (!token) { const b = new Uint8Array(12); crypto.getRandomValues(b); token = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join(''); store.set('tkd-token', token); }
  let code = (() => { try { return sessionStorage.getItem('lounge-code') || ''; } catch (_) { return ''; } })();
  let mySeat = Number(store.get('tkd-seat-' + eventId)) || 0;
  let J = null, formSeq = null, vals = {}, confirming = false, view = 'login', lobby = null, lastErr = '';

  if (!eventId) { app.innerHTML = '<div class="center"><div class="big">대회 코드가 없습니다</div>관리자 화면의 QR을 다시 스캔해 주세요.</div>'; return; }
  const socket = io({ transports: ['websocket', 'polling'] });   // 웹소켓 우선: 연결 지연 감소
  const enter = () => socket.emit('tkd:join', { role: 'judge', event: eventId, code, seat: mySeat || undefined, token });
  socket.on('connect', () => { $('#conn').style.display = 'none'; enter(); });
  socket.on('disconnect', () => { $('#conn').style.display = 'block'; });

  socket.on('tkd:join:result', (r) => {
    if (!r.ok) {
      const msg = { 'code-required': '참가 코드를 입력하세요.', 'bad-code': '참가 코드가 맞지 않습니다.', 'rate-limited': '시도가 너무 많습니다. 1분 뒤 다시 시도하세요.', 'no-event': '아직 열리지 않은 대회입니다. 관리자가 먼저 화면을 열어야 합니다.', 'seat-taken': '이미 다른 기기에서 사용 중인 심판 번호입니다. 다른 번호를 선택하세요.', 'bad-seat': '심판 번호가 올바르지 않습니다.' }[r.reason] || '입장할 수 없습니다.';
      if (r.reason === 'seat-taken' || r.reason === 'bad-seat') { store.del('tkd-seat-' + eventId); mySeat = 0; lastErr = msg; return enter(); }
      lastErr = msg; if (r.reason === 'bad-code') { code = ''; try { sessionStorage.removeItem('lounge-code'); } catch (_) {} }
      view = r.reason === 'no-event' ? 'noevent' : 'login'; return draw();
    }
    try { sessionStorage.setItem('lounge-code', code); } catch (_) {}
    $('#ttl').textContent = r.kind === 'freestyle' ? '자유품새 심판' : '공인품새 심판';
    if (r.role === 'lobby') { lobby = r; view = 'lobby'; lastErr = ''; draw(); }
    else { mySeat = r.seat; store.set('tkd-seat-' + eventId, String(mySeat)); $('#seatLabel').textContent = `심판 ${mySeat}`; view = 'judge'; lastErr = ''; draw(); }
  });
  socket.on('tkd:seats', (s) => { if (view === 'lobby') { lobby = { ...lobby, ...s }; draw(); } });
  socket.on('tkd:judge', (s) => { J = s; draw(); });
  socket.on('tkd:error', (e) => { lastErr = e.code === 'bad-scores' ? '점수 값이 올바르지 않습니다.' : e.code === 'not-open' ? '지금은 제출할 수 없습니다.' : ''; confirming = false; draw(); });

  const fields = () => J.schema.fields;
  const initVals = () => {
    vals = {};
    for (const s of J.perf.sides) { vals[s.side] = {}; for (const f of fields()) vals[s.side][f.key] = f.def; }
  };
  const calc = (v) => {
    if (J.kind === 'recognized') { const a = Math.max(0, r2(4 - 0.1 * v.minor - 0.3 * v.major)); const p = r2(v.power + v.rhythm + v.energy); return { a, p, total: r2(a + p) }; }
    let a = 0, p = 0; for (const f of fields()) { if (f.type === 'count') continue; if (f.group === 'a') a += v[f.key]; else p += v[f.key]; }
    a = r2(a); p = Math.max(0, r2(p - 0.1 * (v.minor || 0) - 0.3 * (v.major || 0))); return { a, p, total: r2(a + p) };
  };

  function draw() {
    if (view === 'login') {
      app.innerHTML = `<div class="center"><div class="big">참가 코드 입력</div><p class="muted" style="margin-bottom:14px">관리자에게 받은 코드를 입력하세요.</p>
        <form id="f" style="display:flex;flex-direction:column;gap:10px"><input id="code" inputmode="text" autocomplete="off" aria-label="참가 코드" placeholder="참가 코드" value="${esc(code)}"><button class="primary" type="submit">입장</button></form><div class="err">${esc(lastErr)}</div></div>`;
      $('#f').addEventListener('submit', (e) => { e.preventDefault(); code = $('#code').value.trim(); enter(); });
      return;
    }
    if (view === 'noevent') { app.innerHTML = `<div class="center"><div class="big">대회 대기 중</div><p class="muted">${esc(lastErr)}</p><button id="retry" style="margin-top:16px">다시 시도</button></div>`; $('#retry').onclick = enter; return; }
    if (view === 'lobby') {
      app.innerHTML = `<div class="center" style="padding-bottom:10px"><div class="big">심판 번호 선택</div><p class="muted">본인 번호를 눌러 입장하세요. (총 ${lobby.judgeCount}명)</p></div>
        <div class="seatgrid">${lobby.seats.map((s) => `<button data-s="${s.seat}" ${s.connected ? 'disabled' : ''}>심판 ${s.seat}${s.connected ? '<br><small>사용 중</small>' : ''}</button>`).join('')}</div><div class="err" style="text-align:center">${esc(lastErr)}</div>`;
      app.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => { mySeat = Number(b.dataset.s); enter(); }));
      return;
    }
    if (!J) { app.innerHTML = '<div class="center"><div class="big">연결 중…</div></div>'; return; }
    if (!J.perf) {
      if (J.waitingReview) app.innerHTML = '<div class="center"><div class="big">채점 완료 ✔</div><p class="muted">관리자가 점수를 확정하는 중입니다.<br>다음 경기를 기다려 주세요.</p></div>';
      else app.innerHTML = `<div class="center"><div class="big">대기 중</div><p class="muted">${J.phase === 'setup' ? '관리자가 대진을 준비하고 있습니다.' : '다음 선수의 경기가 시작되면<br>채점 화면이 자동으로 열립니다.'}</p></div>`;
      formSeq = null; confirming = false; return;
    }
    if (J.perf.mySubmitted) { app.innerHTML = '<div class="center"><div class="big">제출 완료 ✔</div><p class="muted">다른 심판의 제출을 기다리고 있습니다.</p></div>'; return; }
    if (formSeq !== J.perf.seq) { formSeq = J.perf.seq; initVals(); confirming = false; lastErr = ''; }
    drawForm();
  }

  const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const itemFields = () => fields().filter((f) => f.type !== 'count');
  const dedBox = (side, key, txt, cls) => `<div class="ded-box ${cls}"><button class="dbtn" data-d="${side}:${key}" aria-label="감점 ${txt}">${txt}</button><div class="cnt">× <b id="c-${side}-${key}">${vals[side][key]}</b> <button class="undo" data-u="${side}:${key}" aria-label="${txt} 취소">↶</button></div></div>`;
  function sheetHtml(p) {
    const sides = p.sides.map((s) => s.side), dual = sides.length === 2;
    const rec = J.kind === 'recognized';
    const rowsFor = (side) => '';
    // 행: [왼쪽 값 | 항목명 | 오른쪽 값]
    const cell = (side, f) => {
      const v = vals[side][f.key];
      return `<button class="box v ${side}" data-pick="${side}:${f.key}" id="v-${side}-${f.key}" aria-label="${esc(f.label)} 점수 선택">${f1(v)}</button>`;
    };
    const accCell = (side) => `<div class="box acc v ${side}" id="v-${side}-acc">${f1(calc(vals[side]).a)}</div>`;
    const empty = '<div class="v"></div>';
    const rows = [];
    const lead = sides[0], tail = sides[1];
    const mk = (label, fn, extra = '') => rows.push(`<div class="row3 ${extra}">${fn(lead)}<div class="lb">${label}</div>${dual ? fn(tail) : ''}</div>`);
    if (rec) {
      mk('정확성', accCell, 'accrow');
      itemFields().forEach((f) => mk(esc(f.label), (sd) => cell(sd, f)));
    } else {
      rows.push(`<div class="grp3">${esc(J.schema.labels.a)} 영역</div>`);
      itemFields().filter((f) => f.group === 'a').forEach((f) => mk(esc(f.label), (sd) => cell(sd, f)));
      rows.push(`<div class="grp3">${esc(J.schema.labels.p)} 영역</div>`);
      itemFields().filter((f) => f.group === 'p').forEach((f) => mk(esc(f.label), (sd) => cell(sd, f)));
    }
    const dedA = dual ? `<div class="ded stack a">${dedBox(lead, 'minor', '-0.1', 'minor')}${dedBox(lead, 'major', '-0.3', 'major')}</div>` : `<div class="ded a">${dedBox(lead, 'minor', '-0.1', 'minor')}</div>`;
    const dedB = dual ? `<div class="ded stack b">${dedBox(tail, 'minor', '-0.1', 'minor')}${dedBox(tail, 'major', '-0.3', 'major')}</div>` : `<div class="ded b">${dedBox(lead, 'major', '-0.3', 'major')}</div>`;
    return `<div class="sheet ${dual ? 'dual' : 'solo'}">${dedA}<div class="rows">${rows.join('')}</div>${dedB}</div>`;
  }
  function hdrHtml(p) {
    const boxes = (s) => { const t = calc(vals[s.side]); return `<div class="hb"><span class="b1" id="ha-${s.side}">${f1(t.a)}</span><span class="b2" id="hp-${s.side}">${f1(t.p)}</span><span class="b3" id="t-${s.side}">${f1(t.total)}</span></div>`; };
    const who = (s) => `<div class="hw ${s.side}"><b>${s.side === 'a' ? '청 · ' : s.side === 'b' ? '홍 · ' : ''}${esc(s.name)}</b><span>${esc(s.team)}</span></div>`;
    const kindTxt = J.kind === 'freestyle' ? '자유품새' : '공인품새';
    const mid = `<div class="hm"><span class="pill">${p.tiebreak ? '동점 추가 · ' : ''}${esc(p.poomsae || '채점 중')}${!p.tiebreak && p.passCount > 1 ? ` · ${p.pass + 1}/${p.passCount}` : ''}</span><button class="send" id="ok">결과전송</button></div>`;
    const L = p.sides.length === 2 ? `<div class="hs">${who(p.sides[0])}${boxes(p.sides[0])}</div>${mid}<div class="hs r">${boxes(p.sides[1])}${who(p.sides[1])}</div>` : `<div class="hs">${who(p.sides[0])}${boxes(p.sides[0])}</div>${mid}`;
    return `<div class="hdr ${p.sides.length === 2 ? 'dual' : 'solo'}"><div class="hk">${kindTxt} · 심판 ${mySeat}</div><div class="hrow">${L}</div></div>`;
  }
  function drawForm() {
    const p = J.perf;
    if (confirming) {
      const rows = p.sides.map((s) => `<div class="side ${s.side === 'solo' ? 'solo' : s.side}"><header><div class="who"><b>${esc(s.name)}</b><span>${s.label ? s.label + '팀' : ''}</span></div><div class="tot"><b>${f2(calc(vals[s.side]).total)}</b><span>합계</span></div></header></div>`).join('');
      app.innerHTML = `<div style="text-align:center">${p.poomsae ? `<span class="pill">${esc(p.poomsae)}</span>` : ''}</div><div class="center" style="padding:20px 0 4px"><div class="big">이대로 제출할까요?</div><p class="muted">제출 후에는 수정할 수 없습니다.</p></div>${rows}<div class="err" style="text-align:center">${esc(lastErr)}</div>
        <div class="submit"><div style="display:grid;grid-template-columns:1fr 2fr;gap:10px"><button id="back">돌아가기</button><button class="primary" id="go">제출</button></div></div>`;
      $('#back').onclick = () => { confirming = false; drawForm(); };
      $('#go').onclick = () => { $('#go').disabled = true; socket.emit('tkd:submit', { scores: vals }); };
      return;
    }
    app.innerHTML = `${hdrHtml(p)}${sheetHtml(p)}<div class="err" style="text-align:center">${esc(lastErr)}</div><div class="picker" id="picker" hidden></div>`;
    $('#ok').onclick = () => { confirming = true; window.scrollTo(0, 0); drawForm(); };
    app.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => {
      const [side, key] = b.dataset.d.split(':'); const f = fields().find((x) => x.key === key);
      vals[side][key] = Math.min(f.max, vals[side][key] + 1); refresh(side);
      if (navigator.vibrate) navigator.vibrate(30);
    }));
    app.querySelectorAll('[data-u]').forEach((b) => b.addEventListener('click', () => {
      const [side, key] = b.dataset.u.split(':'); vals[side][key] = Math.max(0, vals[side][key] - 1); refresh(side);
    }));
    app.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => openPicker(...b.dataset.pick.split(':'))));
  }
  function openPicker(side, key) {
    const f = fields().find((x) => x.key === key), pk = $('#picker'), cur = vals[side][key];
    const opts = []; for (let v = Math.round(f.max * 10); v >= Math.round(f.min * 10); v--) opts.push(v / 10);
    pk.innerHTML = `<div class="pk"><div class="pkt">${esc(f.label)}</div><div class="pkg">${opts.map((v) => `<button class="${v === cur ? 'on' : ''}" data-v="${v}">${v.toFixed(1)}</button>`).join('')}</div><button class="pkx" id="pkx">닫기</button></div>`;
    pk.hidden = false;
    pk.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => { vals[side][key] = Number(b.dataset.v); pk.hidden = true; refresh(side); }));
    $('#pkx').onclick = () => { pk.hidden = true; };
    pk.onclick = (e) => { if (e.target === pk) pk.hidden = true; };
  }
  function refresh(side) {
    const t = calc(vals[side]);
    $(`#t-${side}`).textContent = f1(t.total); $(`#ha-${side}`).textContent = f1(t.a); $(`#hp-${side}`).textContent = f1(t.p);
    const acc = $(`#v-${side}-acc`); if (acc) acc.textContent = f1(t.a);
    for (const f of fields()) {
      const el = $(`#v-${side}-${f.key}`); if (el && f.type !== 'count') el.textContent = f1(vals[side][f.key]);
      const c = $(`#c-${side}-${f.key}`); if (c) c.textContent = vals[side][f.key];
    }
  }
})();
</script>
</body>
</html>
