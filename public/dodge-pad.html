<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f6bff" id="theme-color">
<title>피구 - 플레이 라운지</title>
<style>
  :root { --bg: #1c1f27; --bg-deep: #101218; --ink: #fff; --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  body[data-team="blue"] { --bg: #2f6bff; --bg-deep: #0b2a86; }
  body[data-team="red"]  { --bg: #ff4536; --bg-deep: #8c1409; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: linear-gradient(170deg, var(--bg) 0%, var(--bg-deep) 100%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }
  body.out { background: #20222a; } body.frozen { background: linear-gradient(170deg, #7fd3ff, #1c5a8c); }
  .app { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 18px; gap: 10px; }
  .app-main { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .team-name { font-size: 1.4rem; font-weight: 900; } .timer { font-size: 1.8rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .mode-tag { font-size: .85rem; font-weight: 800; padding: .2em .8em; border-radius: 999px; background: rgba(0,0,0,.28); }
  .scoreline { font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tap { flex: 1; width: 100%; min-height: 0; border: 4px solid rgba(255,255,255,.5); border-radius: 28px; background: rgba(0,0,0,.16); color: inherit; font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 14px; }
  .tap:disabled { opacity: .85; }
  body.out .tap { border-color: rgba(255,255,255,.25); background: rgba(0,0,0,.3); }
  .tap.confirm { border-color: #ffd23f; background: rgba(255,210,63,.25); }
  .tap-main { font-size: clamp(2.4rem, 13vw, 5rem); font-weight: 900; line-height: 1.1; } .tap-sub { font-size: 1.1rem; font-weight: 700; line-height: 1.4; opacity: .92; }
  .msg { font-size: .9rem; text-align: center; max-width: 420px; line-height: 1.45; min-height: 1.3em; }
  .gate, .noroom, .chooser { display: none; width: 100%; max-width: 420px; flex-direction: column; gap: 14px; margin-top: 12vh; align-items: center; text-align: center; line-height: 1.5; }
  body.need-code .gate, body.no-room .noroom, body.no-team .chooser { display: flex; }
  body.need-code .app-main, body.no-room .app-main, body.no-team .app-main { display: none; }
  body.no-room .gate, body.no-team .gate { display: none; }
  .gate input { width: 100%; font: inherit; font-size: 1.5rem; text-align: center; letter-spacing: .1em; padding: .8em; border-radius: 14px; border: 0; background: rgba(255,255,255,.95); color: #11141b; user-select: text; -webkit-user-select: text; }
  .gate-btn, .chooser a { width: 100%; font: inherit; font-size: 1.4rem; font-weight: 900; padding: 1em 0; border: 0; border-radius: 18px; background: #fff; color: #11141b; text-decoration: none; display: block; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; } .flash.on { animation: flash .22s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  .ev { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; pointer-events: none; }
  .ev.show { display: flex; animation: evin .3s ease-out; }
  .ev .big { font-size: clamp(3rem, 18vw, 6rem); font-weight: 900; text-shadow: 0 4px 24px rgba(0,0,0,.4); } .ev .small { font-size: 1.2rem; font-weight: 700; }
  .ev.revive { background: rgba(46,204,113,.92); } .ev.freeze { background: rgba(80,170,230,.94); } .ev.thaw { background: rgba(255,170,40,.94); } .ev.over { background: rgba(20,22,30,.94); pointer-events: auto; }
  @keyframes evin { from { transform: scale(1.12); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .frozen-bar { display: none; width: 100%; text-align: center; font-weight: 900; font-size: 1.1rem; background: rgba(255,255,255,.85); color: #1c5a8c; padding: .5em; border-radius: 12px; }
  body.frozen .frozen-bar { display: block; }
  @media (prefers-reduced-motion: reduce) { .flash.on, .ev.show { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="chooser"><p style="font-size:1.1rem">이 화면은 점수판의 QR 코드로 열어야 합니다.</p><a href="/">플레이 라운지 메뉴로</a></div>
  <div class="noroom"><p style="font-size:1.3rem;font-weight:800">경기방을 찾을 수 없습니다</p><p>점수판 화면의 QR 코드를 다시 스캔해 주세요.<br>점수판이 열려 있으면 자동으로 다시 연결합니다.</p></div>
  <div class="gate">
    <p style="font-size:1.2rem;font-weight:800">참가 코드를 입력하세요</p>
    <input id="code-input" type="text" autocomplete="off" autocapitalize="characters" maxlength="30" placeholder="참가 코드" aria-label="참가 코드">
    <button class="gate-btn" id="code-btn">입장하기</button>
    <div class="msg" id="gate-msg" role="alert"></div>
  </div>

  <div class="app-main">
    <div class="top"><div class="team-name" id="team-name"></div><span class="mode-tag" id="mode-tag"></span><div class="timer" id="timer">3:00</div></div>
    <div class="frozen-bar">❄ 얼음! 땡 소리가 날 때까지 멈춰요</div>
    <button class="tap" id="tap" aria-live="polite"><div class="tap-main" id="tap-main">연결 중</div><div class="tap-sub" id="tap-sub"></div></button>
    <div class="scoreline" id="scoreline"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<div class="flash" id="flash"></div>
<div class="ev" id="ev" role="alert"><div class="big" id="ev-big"></div><div class="small" id="ev-small"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/mission.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const team = params.get('team'), room = (params.get('room') || '').toUpperCase();
  const TEAM_LABEL = { blue: '청팀', red: '홍팀' }, TEAM_COLOR = { blue: '#2f6bff', red: '#ff4536' };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  if (!TEAM_LABEL[team]) document.body.classList.add('no-team');
  else { document.body.dataset.team = team; $('team-name').textContent = TEAM_LABEL[team]; $('theme-color').setAttribute('content', TEAM_COLOR[team]); document.title = `${TEAM_LABEL[team]} 피구`; if (!room) document.body.classList.add('no-room'); }

  let game = null, dodge = null, me = { alive: true }, scores = { blue: 0, red: 0 }, gameType = null, confirmUntil = 0, confirmTimer = null;
  const isLive = () => game && game.running && game.mode === 'round';
  const survival = () => !dodge || dodge.mode === 'survival';

  function render() {
    const b = document.body, main = $('tap-main'), sub = $('tap-sub'), tap = $('tap');
    if (game) $('timer').textContent = fmt(game.remainingSec);
    b.classList.toggle('frozen', !!(dodge && dodge.frozen));
    b.classList.toggle('out', survival() && !me.alive);
    tap.classList.remove('confirm'); tap.disabled = false;
    $('mode-tag').textContent = survival() ? '생존 피구' : '점수 피구';
    if (dodge) {
      $('scoreline').textContent = survival()
        ? `생존  청 ${dodge.teams.blue.alive}/${dodge.teams.blue.total} : ${dodge.teams.red.alive}/${dodge.teams.red.total} 홍`
        : `청 ${scores.blue} : ${scores.red} 홍`;
    }
    if (!game) { main.textContent = '연결 중'; sub.textContent = ''; tap.disabled = true; return; }
    if (dodge && dodge.frozen) { main.textContent = '얼음!'; sub.textContent = '땡 소리가 날 때까지 멈춰요'; tap.disabled = true; return; }
    if (dodge && dodge.over) { main.textContent = '경기 종료'; sub.textContent = dodge.over === 'draw' ? '무승부' : `${TEAM_LABEL[dodge.over]} 승리!`; tap.disabled = true; return; }
    if (survival()) {
      if (!me.alive) { main.textContent = '아웃'; sub.textContent = '전체 부활 이벤트를 기다리세요'; tap.disabled = true; return; }
      if (!isLive()) { main.textContent = game.mode === 'rest' ? '휴식 시간' : game.finished ? '라운드 종료' : '대기 중'; sub.textContent = '경기가 시작되면 피구를 즐기세요'; tap.disabled = true; return; }
      if (Date.now() < confirmUntil) { tap.classList.add('confirm'); main.textContent = '정말 아웃?'; sub.textContent = '한 번 더 누르면 아웃 처리됩니다'; return; }
      main.textContent = '생존 중'; sub.textContent = '공에 맞았다면 눌러요 (아웃)';
    } else {
      if (!isLive()) { main.textContent = game.mode === 'rest' ? '휴식 시간' : game.finished ? '라운드 종료' : '대기 중'; sub.textContent = '경기가 시작되면 득점할 수 있어요'; tap.disabled = true; return; }
      main.textContent = '명중! +1'; sub.textContent = '상대를 공으로 맞혔다면 눌러요';
    }
  }

  /* 소켓 */
  const socket = io();
  if (window.Mission) Mission.attach(socket, 'phone');
  let accessCode = ''; try { accessCode = localStorage.getItem('strike-code') || ''; } catch (_) {}
  const joinNow = () => socket.emit('join', { team, code: accessCode, room });
  const GATE_MSG = { 'bad-code': '참가 코드가 맞지 않습니다.', 'rate-limited': '시도가 너무 많습니다. 1분 뒤에 다시 시도하세요.', 'code-required': '' };
  socket.on('connect', () => { if (TEAM_LABEL[team] && room) joinNow(); });
  socket.on('disconnect', () => { $('tap-main').textContent = '재연결 중'; $('tap-sub').textContent = ''; });
  socket.on('join:result', (r) => {
    if (r.ok) { document.body.classList.remove('need-code', 'no-room'); try { localStorage.setItem('strike-code', accessCode); } catch (_) {} }
    else if (r.reason === 'no-room' || r.reason === 'bad-room') { document.body.classList.remove('need-code'); document.body.classList.add('no-room'); if (r.reason === 'no-room') setTimeout(joinNow, 3000); }
    else { if (r.reason === 'bad-code') { accessCode = ''; try { localStorage.removeItem('strike-code'); } catch (_) {} } document.body.classList.add('need-code'); $('gate-msg').textContent = GATE_MSG[r.reason] || ''; }
  });
  const submitCode = () => { accessCode = $('code-input').value.trim(); joinNow(); };
  $('code-btn').addEventListener('click', submitCode);
  $('code-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCode(); });

  socket.on('room:game', (g) => { gameType = g; $('msg').textContent = g === 'dodge' ? '' : '이 경기방은 피구가 아닙니다. 점수판에서 피구를 선택하세요.'; });
  socket.on('game:state', (s) => { game = s; render(); });
  socket.on('dodge:state', (d) => { dodge = d; render(); showOver(); });
  socket.on('dodge:me', (m) => { me = m; render(); });
  socket.on('score:update', (s) => { scores = { blue: s.blue, red: s.red }; render(); });
  setInterval(() => { if (game && game.running) render(); }, 500);

  /* 이벤트 연출 (전체 부활 / 얼음 / 땡) */
  let audio = null, evTimer = null;
  const tone = (f, dur, at = 0, type = 'sine', vol = .25, to) => {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime + at, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + .05); } catch (_) {}
  };
  const EVT = {
    revive: { big: '전체 부활!', small: '모두 다시 살아났어요', sfx: () => [392, 523, 659, 784].forEach((f, i) => tone(f, .3, i * .12, 'triangle')), vib: [80, 40, 80, 40, 160] },
    freeze: { big: '❄ 얼음!', small: '그대로 멈춰요', sfx: () => { tone(1568, .5, 0, 'sine', .22, 400); tone(1175, .6, .1, 'sine', .15, 300); }, vib: [200] },
    thaw:   { big: '땡!', small: '다시 움직여요', sfx: () => { tone(880, 1.0, 0, 'sine', .3); tone(1320, .8, .02, 'sine', .12); }, vib: [60, 30, 60] },
  };
  socket.on('dodge:event', ({ type }) => {
    const d = EVT[type]; if (!d) return;
    const el = $('ev'); el.className = `ev show ${type}`; $('ev-big').textContent = d.big; $('ev-small').textContent = d.small;
    d.sfx(); if (navigator.vibrate) navigator.vibrate(d.vib);
    clearTimeout(evTimer); evTimer = setTimeout(() => el.classList.remove('show'), type === 'freeze' ? 1800 : 2200);
  });
  let shownOver = null;
  function showOver() {
    if (!dodge || !dodge.over) { shownOver = null; return; }
    if (shownOver === dodge.over) return; shownOver = dodge.over;
    const el = $('ev'); el.className = 'ev show over'; $('ev-big').textContent = dodge.over === 'draw' ? '무승부' : `${TEAM_LABEL[dodge.over]} 승리!`; $('ev-small').textContent = '화면을 누르면 닫혀요';
    el.onclick = () => el.classList.remove('show');
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 250]);
  }

  /* 터치 */
  const flashEl = $('flash');
  const feedback = () => { flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on'); if (navigator.vibrate) navigator.vibrate([60, 30, 60]); };
  $('tap').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!isLive() || !dodge || dodge.frozen || dodge.over) return;
    if (survival()) {
      if (!me.alive) return;
      if (Date.now() >= confirmUntil) { confirmUntil = Date.now() + 2500; clearTimeout(confirmTimer); confirmTimer = setTimeout(render, 2600); render(); return; }
      confirmUntil = 0;
      socket.emit('dodge:out', {}, (res) => { if (res && res.accepted) { if (navigator.vibrate) navigator.vibrate(200); } render(); });
    } else {
      socket.emit('hit', { t: Date.now() }, (res) => { if (res && res.accepted) feedback(); });
    }
  });
  const keepAwake = async () => { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (_) {} };
  document.addEventListener('pointerdown', keepAwake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
})();
</script>
</body>
</html>
