<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0c0b">
<title>폭탄 돌리기 · 플레이 라운지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
  :root{color-scheme:dark;--ink:#0d0c0b;--ink-2:#171513;--paper:#f1ebdd;--muted:#a8a090;--brass:#c9a862;--line:rgba(241,235,221,.14);
    --serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;transition:background .08s}
  body.hot{background:#2a0d0a}
  body.boom{background:#f6e7b8;color:#1a1308}
  body.blind{background:#000}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .top{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
  .top .logo{font-family:var(--serif);font-weight:900;letter-spacing:.04em}
  .top .back{color:var(--muted);font-size:.86rem}
  body.blind .top,body.blind .opts{opacity:.25}
  main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column}
  h1{font-family:var(--serif);font-weight:900;font-size:1.5rem;margin-bottom:6px}
  .lead{color:var(--muted);font-size:.92rem;line-height:1.7;word-break:keep-all}
  .stage{flex:1;min-height:300px;display:grid;place-items:center;text-align:center;padding:10px 0}
  .bomb{width:min(62vw,260px);height:auto;transform-origin:50% 70%}
  .bomb .body{fill:#2b2926;stroke:#4a4640;stroke-width:3}
  .bomb .shine{fill:rgba(255,255,255,.18)}
  .bomb .cap{fill:#6b655b}
  .bomb .fuse{stroke:#c9a862;stroke-width:5;fill:none;stroke-linecap:round}
  .bomb .spark{fill:#ffb347;transform-origin:center;transform-box:fill-box}
  .running .bomb{animation:wob var(--wob,.7s) ease-in-out infinite}
  .running .spark{animation:sp .18s steps(2) infinite}
  @keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
  @keyframes sp{50%{transform:scale(1.5);opacity:.6}}
  .say{font-family:var(--serif);font-weight:900;font-size:clamp(2.4rem,14vw,4.6rem);line-height:1.15;margin-top:10px}
  .sub{color:var(--muted);margin-top:6px;font-size:.95rem}
  body.boom .sub{color:#5b4a22}
  .opts{display:grid;gap:12px;margin:6px 0 16px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1;border:1px solid var(--line);background:none;border-radius:999px;padding:10px 8px;font-size:.9rem;color:var(--muted);font-weight:600}
  .chip[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .chk{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
  .chk input{width:20px;height:20px;accent-color:var(--brass)}
  .go{width:100%;padding:18px;border-radius:999px;border:1px solid var(--brass);background:var(--brass);color:var(--ink);font-weight:800;font-size:1.15rem}
  body.boom .go{background:#1a1308;color:#f6e7b8;border-color:#1a1308}
  .running .opts{opacity:.35;pointer-events:none}
  .running .go{background:none;color:var(--paper);border-color:var(--line)}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:fl .5s ease-out}
  @keyframes fl{0%{opacity:.95}100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.running .bomb,.running .spark{animation:none}.flash.on{animation:none;opacity:0}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/">플레이 라운지</a><a class="back" href="/#games">홈으로</a></header>
<main id="app">
  <h1>폭탄 돌리기</h1>
  <p class="lead">폰 없이 소리로만 즐겨요. 시작을 누르고 공이나 인형을 옆 사람에게 돌리세요. 똑딱 소리는 판마다 달라서 빨라지기도 하고 느려지기도 하고 가끔 멈추기도 해요. 언제 터질지는 아무도 몰라요. 터질 때 들고 있던 사람이 걸립니다.</p>
  <div class="stage" id="stage" aria-live="assertive">
    <div>
      <svg class="bomb" id="bomb" viewBox="0 0 200 200" role="img" aria-label="폭탄"><circle class="body" cx="96" cy="118" r="70"/><ellipse class="shine" cx="70" cy="92" rx="18" ry="26" transform="rotate(30 70 92)"/><rect class="cap" x="82" y="30" width="30" height="20" rx="4"/><path class="fuse" d="M112 38 C130 22 150 30 156 14"/><circle class="spark" cx="158" cy="12" r="9"/></svg>
      <div class="say" id="say">준비됐나요?</div>
      <div class="sub" id="sub">시간 범위를 고르고 시작을 누르세요</div>
    </div>
  </div>
  <div class="opts">
    <div class="seg" id="len" role="group" aria-label="터지는 시간">
      <button class="chip" data-r="10,25" aria-pressed="false">짧게</button>
      <button class="chip" data-r="20,45" aria-pressed="true">보통</button>
      <button class="chip" data-r="40,75" aria-pressed="false">길게</button>
    </div>
    <label class="chk"><input type="checkbox" id="blind"> 화면 끄고 소리만 (남은 시간을 눈으로 볼 수 없게)</label>
  </div>
  <button class="go" id="go">시작</button>
</main>
<div class="flash" id="flash"></div>
<script>
const $ = (s) => document.querySelector(s);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
let ac = null, wake = null;
function audio() { if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, d, vol, type) {
  const a = audio(); if (!a) return; const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(a, dur, decay) { const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); const n = a.createBufferSource(); n.buffer = buf; return n; }
function boomBig(a, t) {                                   // 묵직한 폭발
  const n = noise(a, 1.6, 2.2), lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(180, t + 1.2);
  n.connect(lp).connect(a.destination); n.start(t);
  const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.7);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1);
}
function boomPop(a, t) {                                   // 짧고 날카로운 펑 + 파편 소리
  const n = noise(a, 0.5, 3), hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600; n.connect(hp).connect(a.destination); n.start(t);
  const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.25);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.4);
  for (let i = 0; i < 6; i++) { const c = noise(a, 0.08, 2), cg = a.createGain(); cg.gain.value = 0.5; c.connect(cg).connect(a.destination); c.start(t + 0.25 + Math.random() * 0.7); }
}
function boomWhistle(a, t) {                               // 휘이익 하다가 쾅
  const w = a.createOscillator(), wg = a.createGain(); w.type = 'sine'; w.frequency.setValueAtTime(1800, t); w.frequency.exponentialRampToValueAtTime(300, t + 0.45);
  wg.gain.setValueAtTime(0.35, t); wg.gain.linearRampToValueAtTime(0, t + 0.45); w.connect(wg).connect(a.destination); w.start(t); w.stop(t + 0.5);
  boomBig(a, t + 0.45);
}
function boom() {
  const a = audio(); if (!a) return; const t = a.currentTime;
  [boomBig, boomPop, boomWhistle][Math.floor(Math.random() * 3)](a, t);
}
let range = store.get('pl-bomb-range', '20,45'), run = null;
document.querySelectorAll('#len .chip').forEach((b) => {
  b.setAttribute('aria-pressed', String(b.dataset.r === range));
  b.onclick = () => { range = b.dataset.r; store.set('pl-bomb-range', range); document.querySelectorAll('#len .chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); };
});
$('#blind').checked = store.get('pl-bomb-blind', false);
$('#blind').onchange = () => store.set('pl-bomb-blind', $('#blind').checked);

async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
function release() { try { wake && wake.release(); } catch (_) {} wake = null; }
function setView(state) {
  document.body.classList.toggle('hot', state === 'hot'); document.body.classList.toggle('boom', state === 'boom');
  document.body.classList.toggle('blind', state !== 'idle' && state !== 'boom' && $('#blind').checked);
  $('#app').classList.toggle('running', state === 'run' || state === 'hot');
  $('#bomb').style.visibility = (state !== 'idle' && state !== 'boom' && $('#blind').checked) ? 'hidden' : 'visible';
}
function stop() { if (run) { clearTimeout(run.t); run = null; } release(); }
function start() {
  stop(); audio();
  const [lo, hi] = range.split(',').map(Number), total = (lo + Math.random() * (hi - lo)) * 1000;
  // 판마다 소리 패턴을 다르게 해서 타이밍을 외울 수 없게 한다
  const shape = { pow: 0.9 + Math.random() * 1.9, floor: 110 + Math.random() * 150, flat: Math.random() < 0.25, pauseP: 0.05 + Math.random() * 0.1 };
  run = { t: 0, begin: performance.now(), total, n: 0 };
  $('#go').textContent = '멈추기'; $('#say').textContent = '돌려요!'; $('#sub').textContent = $('#blind').checked ? '소리를 잘 들으세요' : '공을 옆 사람에게 넘기세요';
  setView('run'); keepAwake();
  const tick = () => {
    if (!run) return;
    const p = (performance.now() - run.begin) / run.total;
    if (p >= 1) { explode(); return; }
    run.n++; tone((run.n % 2 ? 900 : 640) * (0.96 + Math.random() * 0.1), 0.06, 0.4, 'square');
    let gap = shape.flat ? 330 + Math.random() * 120 : shape.floor + 620 * Math.pow(1 - p, shape.pow);   // 점점 빨라지는 판, 일정한 판이 섞여 있음
    gap *= 0.7 + Math.random() * 0.6;                                                                   // 박자를 일부러 흔든다
    if (Math.random() < shape.pauseP) gap += 500 + Math.random() * 1100;                                // 가끔 뚝 멈춰서 긴장감을 준다
    const hot = !shape.flat && p > 0.75 && gap < 400;
    if (hot) { setView('hot'); $('#app').style.setProperty('--wob', Math.max(0.12, gap / 1000) + 's'); } else { setView('run'); $('#app').style.setProperty('--wob', Math.max(0.2, gap / 900) + 's'); }
    run.t = setTimeout(tick, gap);
  };
  tick();
}
function explode() {
  run = null; release(); boom(); setView('boom');
  $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
  try { navigator.vibrate && navigator.vibrate([200, 80, 300]); } catch (_) {}
  $('#go').textContent = '다시 하기'; $('#say').textContent = '펑!'; $('#sub').textContent = '들고 있던 사람이 걸렸어요';
  $('#bomb').style.visibility = 'visible';
}
$('#go').onclick = () => { if (run) { stop(); setView('idle'); $('#go').textContent = '시작'; $('#say').textContent = '준비됐나요?'; $('#sub').textContent = '시간 범위를 고르고 시작을 누르세요'; } else start(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && run) keepAwake(); });
</script>
</body>
</html>
