<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자유품새 음원 만들기 - 플레이 라운지</title>
<style>
  :root { --bg:#12141b; --panel:#1b1e28; --panel2:#232736; --ink:#f5f7fb; --muted:#9aa3b5; --line:#2e3342; --gold:#ffd23f; --green:#2ecc71;
    --font:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); background:var(--bg); color:var(--ink); min-height:100vh; }
  button { font:inherit; font-weight:800; border:0; border-radius:10px; padding:.65em 1.1em; background:#323847; color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { background:#3f4659; } button:disabled { opacity:.35; cursor:not-allowed; }
  button.primary { background:#1f9d57; } button.primary:hover:not(:disabled) { background:#25b566; }
  button.small { padding:.35em .8em; font-size:.85rem; font-weight:700; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  input, select { font:inherit; background:#12141b; color:var(--ink); border:2px solid #3a4152; border-radius:10px; padding:.5em .6em; width:100%; }
  a { color:inherit; }
  .bar { display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .bar h1 { font-size:1.2rem; font-weight:900; } .bar .back { color:var(--muted); text-decoration:none; font-size:.9rem; margin-left:auto; }
  .wrap { max-width:1000px; margin:0 auto; padding:18px 16px 70px; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2 { font-size:1.05rem; margin-bottom:10px; }
  .muted { color:var(--muted); } .hint { color:var(--muted); font-size:.82rem; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  label.f { display:flex; flex-direction:column; gap:5px; color:var(--muted); font-size:.85rem; }
  .styles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:12px; }
  .style-btn { text-align:left; background:var(--panel2); border:2px solid transparent; padding:.7em .8em; }
  .style-btn b { display:block; font-size:1rem; } .style-btn small { font-weight:500; color:var(--muted); font-size:.78rem; }
  .style-btn.on { border-color:var(--gold); background:#3a3520; }
  .knobs { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px 18px; }
  .knob b { color:var(--ink); font-size:.92rem; } .knob .kv { float:right; color:var(--gold); font-weight:700; }
  .knob input[type=range] { width:100%; accent-color:var(--gold); margin:6px 0 2px; } .knob .ends { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); }
  .seed { display:flex; gap:6px; } .seed input { flex:1; } .seed button { padding:.4em .7em; }

  /* 타임라인 */
  .tl { position:relative; height:64px; background:#0d0f14; border-radius:10px; overflow:hidden; cursor:pointer; user-select:none; margin-top:4px; }
  .tl .seg { position:absolute; top:0; bottom:0; border-right:2px solid #0d0f14; padding:4px 5px; font-size:.7rem; font-weight:800; line-height:1.2; overflow:hidden; color:#fff; }
  .tl .seg .lv { display:block; font-weight:500; opacity:.8; }
  .tl .hit { position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; background:var(--gold); box-shadow:0 0 6px var(--gold); }
  .tl .hit.fin { background:#ff5a4a; box-shadow:0 0 6px #ff5a4a; width:4px; }
  .tl .ph { position:absolute; top:0; bottom:0; width:2px; background:#fff; left:0; display:none; }
  .ticks { position:relative; height:16px; font-size:.68rem; color:var(--muted); }
  .ticks span { position:absolute; transform:translateX(-50%); }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.75rem; color:var(--muted); margin-top:4px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:4px; }

  .list { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .item { display:grid; grid-template-columns:76px 1fr 104px 44px 36px; gap:6px; align-items:center; }
  .item.h { grid-template-columns:76px 1fr 36px; }
  .item.s6 { grid-template-columns:76px 1fr 104px 44px 44px 36px; }
  .item .ib { padding:.35em 0; background:none; border:1px solid #3a4152; font-size:.85rem; } .item .ib.on { border-color:var(--gold); background:#3a3520; }
  .ipanel { margin:-2px 0 8px; padding:8px; border:1px dashed #3a4152; border-radius:8px; } .ipanel .inst { display:flex; flex-wrap:wrap; gap:6px; }
  .ipanel .chip { font-size:.8rem; padding:.4em .55em; } .ipanel .chip.ch { border-style:dashed; } .ipanel .ph { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:.82rem; color:var(--muted); }
  .item input, .item select { padding:.4em .5em; font-size:.9rem; }
  .item .x { padding:.35em 0; background:none; border:1px solid #3a4152; color:var(--muted); }
  .item .acc { padding:.35em 0; background:none; border:1px solid #3a4152; filter:grayscale(1); opacity:.45; } .item .acc.on { filter:none; opacity:1; border-color:var(--gold); background:#3a3520; }
  .item .sw { width:10px; height:100%; border-radius:3px; }
  .lhead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .lhead h3 { font-size:.95rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .inst { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:6px; margin-top:6px; }
  .chip { background:var(--panel2); border:2px solid transparent; font-weight:700; font-size:.88rem; padding:.55em .5em; text-align:left; opacity:.6; }
  .chip.on { opacity:1; border-color:var(--gold); background:#3a3520; }
  .ihead { margin-top:14px; font-size:.95rem; display:flex; justify-content:space-between; gap:8px; align-items:baseline; flex-wrap:wrap; } .ihead small { color:var(--muted); font-weight:500; font-size:.78rem; }

  .player { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .player .time { font-variant-numeric:tabular-nums; font-weight:800; font-size:1.05rem; min-width:110px; }
  #tap { background:#6b4e12; } #tap:hover:not(:disabled) { background:#86621a; }
  .dirty { margin-top:10px; padding:.6em .8em; border-radius:10px; background:#3a3520; color:#ffe9a6; font-size:.85rem; display:none; }
  .prog { height:8px; background:#0d0f14; border-radius:99px; margin-top:10px; overflow:hidden; display:none; } .prog i { display:block; height:100%; width:0; background:var(--green); transition:width .2s; }
  textarea.ask { font:inherit; width:100%; min-height:72px; resize:vertical; background:#12141b; color:var(--ink); border:2px solid #3a4152; border-radius:12px; padding:.7em .8em; line-height:1.55; }
  .applied { margin-top:10px; font-size:.85rem; line-height:1.6; display:none; background:var(--panel2); border-radius:10px; padding:.6em .8em; }
  .applied b { color:var(--gold); } .applied .miss { color:var(--muted); }
  .opts { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:.9rem; } .opts label { display:flex; gap:6px; align-items:center; cursor:pointer; } .opts input { width:auto; }
  .lenhint { margin-top:8px; padding:.55em .8em; border-radius:10px; background:#1d2a3a; color:#cfe0f5; font-size:.85rem; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .h2row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .h2row h2 { margin:0; }
  .card h2 small { font-size:.75rem; font-weight:500; }
  .glabel { font-weight:800; font-size:.9rem; min-width:92px; }
  .leadrow, .drow { display:flex; align-items:center; gap:10px; } .leadrow select, .drow select { width:auto; flex:1; max-width:280px; }
  .drow { margin-top:10px; display:none; }
  .igroup { margin-top:12px; } .igroup .gh { display:flex; gap:8px; align-items:baseline; margin-bottom:6px; } .igroup .gh small { color:var(--muted); font-size:.78rem; }
  .chip::before { content:''; display:inline-block; width:.9em; } .chip.on::before { content:'✓'; color:var(--gold); }
  .endrow { margin-top:12px; flex-direction:row !important; align-items:center; gap:10px; } .endrow input { width:110px; }
  button.big { font-size:1.05rem; padding:.75em 1.4em; }
  .save { display:grid; grid-template-columns:1fr 1fr auto auto; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  @media (max-width:640px) { .grid4 { grid-template-columns:1fr 1fr; } .save { grid-template-columns:1fr 1fr; } .styles { grid-template-columns:1fr 1fr; } .style-btn small { display:none; } }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000d; color:#fff; padding:.7em 1.1em; border-radius:12px; font-weight:700; display:none; z-index:50; max-width:90vw; text-align:center; }
  @media (max-width:560px) { .tl .seg { font-size:.58rem; padding:3px 2px; word-break:keep-all; } .tl .seg .lv { display:none; } .item { grid-template-columns:66px 1fr 78px 36px 30px; gap:4px; } .item input, .item select { padding:.4em .35em; font-size:.85rem; } .item.h { grid-template-columns:64px 1fr 32px; } .item.s6 { grid-template-columns:62px 1fr 70px 32px 34px 28px; } }
</style>
</head>
<body>
<header class="bar"><h1>🎼 자유품새 음원 만들기 <small id="ver" style="font-size:.6em;opacity:.55;font-weight:400">11.24 저녁판</small></h1><a class="back" id="back" href="/#tkd">홈으로</a></header>

<main class="wrap">
  <section class="card">
    <h2>✨ 말로 설명하기 <small class="muted">선택</small></h2>
    <textarea class="ask" id="ask" placeholder="예: 120 BPM 95초 살사풍 음악. 트럼펫과 박수로 시작하고, 연속 발차기에 북소리, 마지막 자세에 강한 타격."></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" id="ask-go">✨ 설명대로 만들기</button><button class="small" id="ask-ex">예시 넣기</button></div>
    <div class="applied" id="applied"></div>
  </section>

  <section class="card">
    <h2>1. 분위기</h2>
    <div class="styles" id="styles"></div>
    <div class="grid4">
      <label class="f">길이(초)<input type="number" id="dur" min="60" max="180" step="1" title="WT 자유품새 경기 시간은 90~100초예요"></label>
      <label class="f">빠르기(BPM)<input type="number" id="bpm" min="70" max="180" step="1"></label>
      <label class="f">조성<select id="key"></select></label>
      <label class="f">변주 번호<span class="seed"><input type="number" id="seed" min="1" max="9999" title="번호를 바꾸면 화음 진행과 멜로디가 달라져요. 같은 번호면 똑같이 다시 만들어져요."><button id="dice" title="다른 변주" aria-label="다른 변주로 바꾸기">🎲</button></span></label>
    </div>
  </section>

  <section class="card">
    <div class="h2row"><h2>2. 악기</h2><button class="small" id="inst-reset">분위기 기본값으로</button></div>
    <div class="leadrow"><span class="glabel">🎵 멜로디</span><select id="lead" aria-label="멜로디 악기"></select></div>
    <div id="inst"></div>
    <div class="drow" id="drow"><span class="glabel">🥁 드럼 리듬</span><select id="dstyle" aria-label="드럼 세트 리듬"><option value="rock">록 (쿵-짝 기본)</option><option value="funk">펑크 (통통 튀는)</option><option value="disco">디스코 (네 박 쿵쿵)</option><option value="break">브레이크비트 (쪼개진)</option><option value="half">하프타임 (묵직하게)</option></select></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>🎛️ 다채로움·무게</h2><button class="small" id="knob-reset">기본값으로</button></div>
    <div class="knobs" id="knobs"></div>
  </section>

  <section class="card">
    <h2>3. 구간과 타격</h2>
    <div class="tl" id="tl" aria-label="음원 타임라인 (눌러서 이동)"><div class="ph" id="ph"></div></div>
    <div class="ticks" id="ticks"></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>타격 포인트 (그 순간 큰북이 한 번 울림)</span><span><i style="background:#ff5a4a"></i>마지막 동작</span></div>

    <div class="lhead"><h3>구간</h3><div class="row"><select id="preset" style="width:auto;padding:.35em .5em;font-size:.85rem" aria-label="구성 틀" title="실제 대회 곡의 흐름을 본뜬 시작 구성이에요"><option value="">구성 틀 고르기…</option></select><button class="small" id="add-sec">+ 구간</button></div></div>
    <div class="list" id="secs"></div>

    <div class="lhead"><h3>타격 포인트</h3><button class="small" id="add-hit">+ 타격</button></div>
    <div class="list" id="hits"></div>
    <label class="f endrow">마지막 동작(초)<input type="number" id="endhit" min="5" step="0.5"></label>
  </section>

  <section class="card">
    <h2>4. 만들고 저장하기</h2>
    <div class="row"><button class="primary big" id="make">🎼 음원 만들기</button><span class="hint" id="make-info"></span></div>
    <div class="prog" id="prog"><i></i></div>
    <div class="dirty" id="dirty">설정이 바뀌었어요. <b>음원 만들기</b>를 다시 눌러 주세요.</div>
    <div class="player">
      <button id="play" disabled>▶ 재생</button>
      <button id="stop" disabled>■ 처음으로</button>
      <span class="time" id="time">0.0 / 0.0초</span>
      <button id="tap" disabled title="재생하면서 발차기 순간에 누르면(스페이스바도 돼요) 그 시점에 타격 포인트가 생겨요">⚡ 지금 타격 찍기</button>
    </div>
    <div class="save">
      <input id="ath-name" placeholder="선수 이름" aria-label="선수 이름">
      <input id="ath-team" placeholder="소속 (경기에 적은 그대로)" aria-label="소속">
      <button class="primary" id="save-ath" disabled title="이 컴퓨터의 자유품새 대전에서 그 선수 음원으로 바로 쓰여요">선수 음원으로 저장</button>
      <button id="dl" disabled>WAV 내려받기</button>
    </div>
  </section>
  <p class="hint" style="text-align:center;opacity:.6">악기 소리: FluidR3_GM 사운드폰트 (CC BY 3.0, <a href="https://github.com/gleitz/midi-js-soundfonts" target="_blank" rel="noopener">gleitz/midi-js-soundfonts</a>)</p>
</main>
<div id="toast" role="status"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT; const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = 'none'), 3800); };

/* ------------ 설정 ------------ */
const STYLES = {
  pro:    { name: '대회 하이브리드', desc: '보내 주신 대회곡 느낌: 묵직한 북, 현악 리프, 단조', bpm: 124 },
  epic:   { name: '웅장한 북',   desc: '큰북·오케스트라, 시범 같은 무게감', bpm: 120 },
  edm:    { name: '신나는 전자음', desc: '쿵쿵 울리는 댄스 비트', bpm: 128 },
  gugak:  { name: '국악 퓨전',   desc: '장구·꽹과리·피리 느낌 + 비트', bpm: 112 },
  hiphop: { name: '힙합·트랩',   desc: '묵직한 베이스, 잘게 쪼갠 하이햇', bpm: 140 },
  latin:  { name: '살사·라틴',   desc: '클라베·콩가·카우벨, 경쾌한 피아노', bpm: 120 },
};
const INSTR = [
  ['brass', '🎺 트럼펫', /트럼펫|브라스|금관|나팔|팡파르|호른/],
  ['strings', '🎻 현악', /현악|스트링|바이올린|첼로|오케스트라/],
  ['choir', '🎤 합창', /합창|코러스|콰이어|성가|아~/],
  ['piano', '🎹 피아노', /피아노|건반/],
  ['guitar', '🎸 일렉기타', /일렉|기타|록풍|락풍|록 음악|메탈|rock/i],
  ['flute', '🪈 대금·피리', /대금|피리|태평소|플루트|플룻|단소|소금|퉁소/],
  ['bells', '🔔 종소리', /종소리|벨소리|차임|글로켄|실로폰|오르골/],
  ['gong', '🌕 징', /징|gong/i],
  ['shaker', '🪇 셰이커', /셰이커|쉐이커|마라카스/],
  ['clap', '👏 박수', /박수|클랩|손뼉/],
  ['drumkit', '🥁 드럼 세트', /드럼\s*세트|드럼(?!라인)|록\s*비트|락\s*비트|밴드\s*드럼/, 'perc'],
  ['taikoL', '🪘 대북', /대북|큰북|태고|타이코|모둠북|북\s*합주/, 'perc'],
  ['msnare', '🥁 행진 스네어', /스네어|행진|마칭|드럼라인/, 'perc'],
  ['fills', '🥁 톰 필인', /필인|필\s인|탐탐|톰/, 'perc'],
  ['cymbal', '💿 심벌·라이드', /심벌|심볼|라이드|크래시/, 'perc'],
  ['janggu', '🪘 장구', /장구|사물놀이/, 'perc'],
  ['kkwaeng', '🔔 꽹과리', /꽹과리|꽹가리|사물놀이/, 'perc'],
  ['conga', '🪘 콩가·봉고', /콩가|봉고|젬베|퍼커션/, 'perc'],
  ['cowbell', '🐄 카우벨', /카우벨/, 'perc'],
  ['tamb', '🪇 탬버린', /탬버린|탐부린/, 'perc'],
  ['wood', '🪵 우드블록', /우드블록|목탁|클라베|딱딱이/, 'perc'],
];
const STYLE_INST = { pro: ['strings', 'choir', 'brass', 'cymbal', 'gong'], epic: ['strings', 'choir', 'gong', 'brass', 'taikoL', 'fills', 'cymbal'], edm: ['bells', 'clap', 'tamb', 'cymbal'], gugak: ['gong', 'janggu', 'kkwaeng', 'taikoL'], hiphop: ['piano', 'bells', 'msnare', 'wood'], latin: ['piano', 'brass', 'shaker', 'conga', 'cowbell', 'tamb', 'wood'] };

    { // 스스로 점검: 처음부터 마지막 동작까지 4초 넘게 소리가 거의 없는 곳이 있으면 알림(만들다 마는 문제를 바로 알아채게)
      const d = rendered.buf.getChannelData(0), sr = rendered.buf.sampleRate, end = Math.min(rendered.buf.duration, cfg.endHit) - 1, win = Math.floor(sr * .5); let quiet = 0, bad = null, ref = 0;
      for (let i = 0; i < d.length; i += win * 4) { let q = 0; for (let j = i; j < Math.min(d.length, i + win); j++) q += d[j] * d[j]; ref = Math.max(ref, q / win); }
      for (let t = 2; t < end; t += .5) { const i = Math.floor(t * sr); let q = 0; for (let j = i; j < Math.min(d.length, i + win); j++) q += d[j] * d[j]; if (q / win < ref * 1e-4) { quiet += .5; if (quiet > 4 && bad == null) bad = t - quiet; } else quiet = 0; }
      if (bad != null) { $('make-info').textContent += ` · ⚠ ${bad.toFixed(0)}초 뒤에 소리가 거의 없는 곳이 있어요`; console.warn('quiet stretch', bad); }
    }
    ['play', 'stop', 'tap', 'save-ath', 'dl'].forEach((id) => ($(id).disabled = false));
    playOff = 0; updTime(); toast('음원이 만들어졌어요. ▶ 재생으로 들어 보세요.');
  } catch (e) { console.error(e); toast('이 브라우저에서는 음원을 만들 수 없어요. 크롬이나 엣지 최신 버전에서 열어 주세요.'); }
  $('make').disabled = false; $('make').textContent = '🎼 음원 만들기'; setTimeout(() => (pr.style.display = 'none'), 600);
});
function startPlay() {
  if (!rendered) return; actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
  if (playOff >= rendered.buf.duration - .05) playOff = 0;
  srcNode = actx.createBufferSource(); srcNode.buffer = rendered.buf; srcNode.connect(actx.destination);
  srcNode.onended = () => { if (playing && curTime() >= rendered.buf.duration - .1) { playing = false; playOff = 0; btnState(); updTime(); } };
  srcNode.start(0, playOff); playT0 = actx.currentTime; playing = true; btnState(); tick();
}
function stopPlay(rewind) { if (srcNode) { try { srcNode.onended = null; srcNode.stop(); } catch (_) {} srcNode = null; } if (playing) playOff = curTime(); playing = false; if (rewind) playOff = 0; btnState(); updTime(); }
const btnState = () => { $('play').textContent = playing ? '⏸ 일시정지' : '▶ 재생'; };
function updTime() { const D = rendered ? rendered.buf.duration : cfg.dur, t = rendered ? curTime() : 0; $('time').textContent = `${t.toFixed(1)} / ${D.toFixed(1)}초`; const ph = $('ph'); ph.style.display = rendered ? 'block' : 'none'; ph.style.left = (t / cfg.dur * 100) + '%'; }
function tick() { cancelAnimationFrame(raf); updTime(); if (playing) raf = requestAnimationFrame(tick); }
$('play').addEventListener('click', () => (playing ? stopPlay(false) : startPlay()));
$('stop').addEventListener('click', () => stopPlay(true));
$('tl').addEventListener('click', (e) => { if (!rendered) return; const r = $('tl').getBoundingClientRect(); const t = Math.max(0, Math.min(rendered.buf.duration, (e.clientX - r.left) / r.width * cfg.dur)); const was = playing; stopPlay(false); playOff = t; updTime(); if (was) startPlay(); });
$('tap').addEventListener('click', () => {
  if (!rendered) return; const t = Math.round((curTime() - .12) * 2) / 2;    // 누르는 반응 시간만큼 살짝 앞당김
  if (t < 1 || t >= cfg.endHit - .5) return toast('그 위치에는 타격을 넣을 수 없어요.');
  if (cfg.hits.some((h) => Math.abs(h.t - t) < .6)) return toast(`${t}초 근처에 이미 타격이 있어요.`);
  cfg.hits.push({ t, label: '탭' }); sortAll(); changed(); toast(`⚡ ${t}초에 타격 포인트를 넣었어요.`);
});
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && rendered && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $('tap').click(); } });

const fileName = () => { const n = $('ath-name').value.trim(); return `${n ? n + '_' : ''}자유품새_${STYLES[cfg.style].name.replace(/[^\p{L}\p{N}]/gu, '')}_${cfg.seed}.wav`; };
const getWav = () => (wavBlob = wavBlob || toWav(rendered.buf));
$('dl').addEventListener('click', () => { if (!rendered) return; if (dirty && !confirm('바뀐 설정이 아직 반영되지 않았어요. 지금 음원 그대로 내려받을까요?')) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(getWav()); a.download = fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); });

// 자유품새 대전 화면(tkd.html)과 같은 저장소
const musicDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('no-idb')); const rq = indexedDB.open('pl-tkd-music', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('tracks'); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }));
  const tx = (mode, fn) => open().then((db) => new Promise((res, rej) => { const t = db.transaction('tracks', mode); const r = fn(t.objectStore('tracks')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }));
  return { get: (k) => tx('readonly', (st) => st.get(k)), put: (k, v) => tx('readwrite', (st) => st.put(v, k)) };
})();
$('save-ath').addEventListener('click', async () => {
  if (!rendered) return; const name = $('ath-name').value.trim(), team = $('ath-team').value.trim();
  if (!name) { $('ath-name').focus(); return toast('선수 이름을 적어 주세요.'); }
  if (dirty && !confirm('바뀐 설정이 아직 반영되지 않았어요. 지금 음원 그대로 저장할까요?')) return;
  const key = `${name}|${team}`;
  try {
    const old = await musicDB.get(key).catch(() => null);
    if (old && !confirm(`${name} 선수에게 이미 음원(${old.name})이 있어요. 새 음원으로 바꿀까요?`)) return;
    const blob = getWav(); await musicDB.put(key, { blob, name: fileName(), size: blob.size });
    toast(`${name} 선수 음원으로 저장했어요. 자유품새 대전 화면에서 쓸 수 있어요.`);
  } catch (_) { toast('이 브라우저에서는 저장할 수 없어요. (시크릿 모드이거나 저장 공간이 부족해요) WAV로 내려받아 주세요.'); }
});

renderStyles(); fillInputs(); renderLists(); renderTimeline(); updTime();
</script>
